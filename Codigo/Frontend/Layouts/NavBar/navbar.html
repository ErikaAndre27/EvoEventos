    <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EvoEventos - Panel de Administración</title>
    <link rel="stylesheet" href="../../Layouts/TopBar/Topbar.css">
</head>
<button class="menu-toggle">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none"
      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path stroke="none" d="M0 0h24v24H0z" />
      <path d="M4 6h16M4 12h16M4 18h16" />
    </svg>
  </button>

  <!-- NAVEGACIÓN - TODOS LOS LINKS EN UNA LÍNEA -->
  <nav>
    <button class="close-menu">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path stroke="none" d="M0 0h24v24H0z" />
        <path d="M18 6L6 18M6 6l12 12" />
      </svg>
    </button>

  </nav>

    </nav>
    <script>
        const indicator = document.querySelector('.indicator');
        const links = document.querySelectorAll('nav a');

        links.forEach(link => {

            link.addEventListener('click', () => {
                document.querySelector('.active').classList.remove('active');
                link.classList.add('active')
                document.querySelector('nav').classList.remove('menu-open');
            })
        });

        closeMenuButton = document.querySelector('.close-menu');
        menuToggleButton = document.querySelector('.menu-toggle');

        menuToggleButton.addEventListener('click', () => {
            document.querySelector('nav').classList.add('menu-open');
        });
        closeMenuButton.addEventListener('click', () => {
            document.querySelector('nav').classList.remove('menu-open');
        });
    </script>
</body>

</html>
