<!DOCTYPE html>
<html lang="es">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="ModalEmptyState.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<div class="modal-overlay" id="emptyStateModal" onclick="closeModalOnOutsideClick(event)">
  <div class="modal-empty-state">
    
    <!-- Botón cerrar (X) -->
    <button class="close-btn" onclick="closeEmptyStateModal()">✕</button>

    <!-- Marca/Logo -->
    <div class="modal-brand">EvoEventos</div>

    <!-- Título -->
    <h2 class="modal-title">Ups...!</h2>

    <!-- Ilustración -->
    <div class="modal-illustration">🚧</div>

    <!-- Mensaje -->
    <p class="modal-message">
      Aquí no hay nada...<br>
      todavía
    </p>

    <!-- Estado -->
    <span class="modal-status">EN PROCESO</span>

    <!-- Botón de acción -->
    <button class="modal-action-btn" onclick="closeEmptyStateModal()">
      Volver al inicio
    </button>

  </div>
</div>
