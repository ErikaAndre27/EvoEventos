services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: evo_sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Erika12334!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./sql-scripts:/sql-scripts

  init-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: evo_init_db
    depends_on:
      - sqlserver
    volumes:
      - ./sql-scripts:/sql-scripts
    entrypoint:
      - bash
      - -c
      - |
        echo 'Waiting for SQL Server to be ready...'
        for i in {1..120}; do
          /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P 'Erika12334!' -Q 'SELECT 1' -C && break
          echo "Attempt $i: Waiting for SQL Server..."
          sleep 2
        done
        for f in /sql-scripts/*.sql; do
          [ -e "$$f" ] || continue
          echo "Ejecutando $$f...";
          /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P 'Erika12334!' -d master -i "$$f" -b -C;
        done;
        echo 'Scripts ejecutados.'
    restart: "no"

  backend:
    build:
      context: ./Codigo/Backend
      dockerfile: Dockerfile
    container_name: evo_backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "8080:8080"
    depends_on:
      - sqlserver

  frontend:
    build:
      context: ./Codigo/EvoEventosFrontend
      dockerfile: dockerfile.dev
    container_name: evo_frontend
    environment:
      - VITE_API_URL=/api
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  sqlserver_data: